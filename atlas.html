<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Texture Atlas Packer | xGR3ENx Tools</title>
  
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="font/stylesheet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/modern.css">
  <link rel="stylesheet" href="css/tools.css">
</head>

<body>
  <header class="site-header scrolled">
    <div class="site-container">
      <div class="nav-wrapper">
        <a href="index.html" class="brand-logo-link" title="xGR3ENx Tools">
          <img class="brand-logo-img" src="img/logo.svg" alt="xGR3ENx Logo" width="44" height="44">
          <div class="brand-logo-text">
            xGR3ENx
            <span>TOOLS</span>
          </div>
        </a>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-item-link">НА ГЛАВНУЮ</a></li>
        </ul>
      </div>
    </div>
  </header>

  <main style="padding-top: 100px;">
    <section class="section-wrapper" style="padding-top: 2rem;">
      <div class="site-container">
        
        <div class="tool-header">
          <h1>TEXTURE ATLAS PACKER</h1>
          <p>Объединение множества картинок в единый атлас. Снижает количество Draw Calls в WebGL играх.</p>
        </div>

        <div class="tool-layout">
          <!-- Settings Sidebar -->
          <aside class="tool-sidebar">
            <h3 style="margin-bottom: 1.5rem; color: var(--color-primary); font-family: var(--font-display); font-size: 1.8rem;">УПАКОВКА</h3>
            
            <div id="atlasDropzone" class="dropzone" style="min-height: 120px; padding: 1rem; border-width: 1px;">
              <p style="font-size: 1rem;">Перетащите PNG/JPG картинки сюда</p>
              <input type="file" id="imageInput" accept="image/png, image/jpeg" multiple style="display:none;">
            </div>
            
            <div class="form-group" style="margin-top: 1.5rem;">
              <label class="form-label" for="paddingInput">Отступ (Padding, px)</label>
              <input type="number" id="paddingInput" class="form-input" value="2" min="0" max="10">
            </div>

            <div class="form-group">
              <label class="form-label" for="maxSizeInput">Макс. размер (px)</label>
              <select id="maxSizeInput" class="form-select">
                <option value="512">512 x 512</option>
                <option value="1024" selected>1024 x 1024</option>
                <option value="2048">2048 x 2048</option>
                <option value="4096">4096 x 4096</option>
              </select>
            </div>
            
            <button id="btnPack" class="btn-cyber btn-cyber-primary" style="width: 100%; margin-top: 1rem; font-size: 1.2rem; padding: 0.5rem;">
              Собрать Атлас
            </button>

            <div id="exportGroup" style="display:none; margin-top: 1.5rem; gap: 0.5rem; flex-direction: column;">
              <button id="btnExportImage" class="btn-cyber btn-cyber-outline" style="width: 100%; font-size: 1rem; padding: 0.5rem;">Скачать .PNG</button>
              <button id="btnExportJson" class="btn-cyber btn-cyber-outline" style="width: 100%; font-size: 1rem; padding: 0.5rem;">Скачать .JSON</button>
            </div>
            
            <div id="fileList" style="margin-top: 1.5rem; max-height: 150px; overflow-y: auto; font-size: 0.85rem; color: #aaa;"></div>
          </aside>

          <!-- Main Workspace -->
          <div class="tool-main" style="display: flex; align-items: center; justify-content: center; background: #222; background-image: linear-gradient(45deg, #333 25%, transparent 25%), linear-gradient(-45deg, #333 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #333 75%), linear-gradient(-45deg, transparent 75%, #333 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px;">
            <canvas id="atlasCanvas" style="box-shadow: 0 0 15px rgba(0,0,0,0.5); max-width: 100%; max-height: 100%;"></canvas>
          </div>
        </div>

      </div>
    </section>
  </main>

  <script>
    const atlasDropzone = document.getElementById('atlasDropzone');
    const imageInput = document.getElementById('imageInput');
    const fileList = document.getElementById('fileList');
    const btnPack = document.getElementById('btnPack');
    const paddingInput = document.getElementById('paddingInput');
    const maxSizeInput = document.getElementById('maxSizeInput');
    const atlasCanvas = document.getElementById('atlasCanvas');
    const ctx = atlasCanvas.getContext('2d');
    const btnExportImage = document.getElementById('btnExportImage');
    const btnExportJson = document.getElementById('btnExportJson');
    const exportGroup = document.getElementById('exportGroup');

    let loadedImages = [];
    let packedData = null;

    atlasDropzone.addEventListener('click', () => imageInput.click());
    atlasDropzone.addEventListener('dragover', (e) => { e.preventDefault(); atlasDropzone.classList.add('dragover'); });
    atlasDropzone.addEventListener('dragleave', () => atlasDropzone.classList.remove('dragover'));
    atlasDropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      atlasDropzone.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
    });
    imageInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFiles(e.target.files);
    });

    function handleFiles(files) {
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        if (!file.type.startsWith('image/')) continue;
        
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            loadedImages.push({ name: file.name, img: img, w: img.width, h: img.height });
            updateFileList();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function updateFileList() {
      fileList.innerHTML = `Загружено картинок: ${loadedImages.length}<br>` + loadedImages.map(f => f.name).join('<br>');
    }

    // Simple Shelf Bin Packing Algorithm
    function packImages() {
      if (loadedImages.length === 0) return alert('Загрузите картинки!');
      
      const padding = parseInt(paddingInput.value);
      const maxSize = parseInt(maxSizeInput.value);
      
      // Sort images by height (largest first)
      const rects = [...loadedImages].sort((a, b) => b.h - a.h);
      
      let currentX = 0;
      let currentY = 0;
      let maxRowHeight = 0;
      let canvasW = 0;
      let canvasH = 0;
      
      const packed = [];

      for (const rect of rects) {
        if (currentX + rect.w + padding > maxSize) {
          currentY += maxRowHeight + padding;
          currentX = 0;
          maxRowHeight = 0;
        }
        
        if (currentY + rect.h + padding > maxSize) {
          alert('Некоторые картинки не влезли в атлас! Увеличьте макс. размер.');
          break;
        }

        packed.push({
          name: rect.name,
          img: rect.img,
          x: currentX,
          y: currentY,
          w: rect.w,
          h: rect.h
        });

        currentX += rect.w + padding;
        maxRowHeight = Math.max(maxRowHeight, rect.h);
        
        canvasW = Math.max(canvasW, currentX);
        canvasH = Math.max(canvasH, currentY + maxRowHeight);
      }
      
      // Power of Two rounding
      const potW = Math.pow(2, Math.ceil(Math.log2(canvasW)));
      const potH = Math.pow(2, Math.ceil(Math.log2(canvasH)));
      
      atlasCanvas.width = potW;
      atlasCanvas.height = potH;
      
      ctx.clearRect(0, 0, potW, potH);
      
      const jsonFrames = {};

      for (const item of packed) {
        ctx.drawImage(item.img, item.x, item.y, item.w, item.h);
        
        jsonFrames[item.name] = {
          frame: { x: item.x, y: item.y, w: item.w, h: item.h },
          rotated: false,
          trimmed: false,
          spriteSourceSize: { x: 0, y: 0, w: item.w, h: item.h },
          sourceSize: { w: item.w, h: item.h }
        };
      }
      
      packedData = {
        frames: jsonFrames,
        meta: {
          app: "xGR3ENx Texture Packer",
          image: "atlas.png",
          format: "RGBA8888",
          size: { w: potW, h: potH },
          scale: "1"
        }
      };

      exportGroup.style.display = 'flex';
    }

    btnPack.addEventListener('click', packImages);

    function download(dataUrl, filename) {
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    btnExportImage.addEventListener('click', () => {
      if (!packedData) return;
      download(atlasCanvas.toDataURL('image/png'), 'atlas.png');
    });

    btnExportJson.addEventListener('click', () => {
      if (!packedData) return;
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(packedData, null, 2));
      download(dataStr, 'atlas.json');
    });
  </script>
</body>
</html>
