<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Texture Atlas Packer | xGR3ENx Tools</title>
  
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="font/stylesheet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/modern.css">
  <link rel="stylesheet" href="css/tools.css">
</head>

<body>
  <header class="site-header scrolled">
    <div class="site-container">
      <div class="nav-wrapper">
        <a href="index.html" class="brand-logo-link" title="xGR3ENx Tools">
          <img class="brand-logo-img" src="img/logo.svg" alt="xGR3ENx Logo" width="44" height="44">
          <div class="brand-logo-text">
            xGR3ENx
            <span>TOOLS</span>
          </div>
        </a>
        <ul class="nav-menu">
          <li>
            <div class="lang-switcher">
              <button class="lang-btn" data-lang="ru" onclick="window.location.href='atlas.html'">RU</button>
              <button class="lang-btn active" data-lang="en" onclick="window.location.href='atlas_en.html'">EN</button>
            </div>
          </li>
          <li><a href="index.html" class="nav-item-link">HOME</a></li>
        </ul>
      </div>
    </div>
  </header>

  <main style="padding-top: 100px;">
    <section class="section-wrapper" style="padding-top: 2rem;">
      <div class="site-container">
        
        <div class="tool-header">
          <h1>TEXTURE ATLAS PACKER</h1>
          <p>Объединение множества картинок в единый атлас. Снижает количество Draw Calls в WebGL играх.</p>
        </div>

        <div class="tool-layout">
          <!-- Settings Sidebar -->
          <aside class="tool-sidebar">
            <h3 style="margin-bottom: 1.5rem; color: var(--color-primary); font-family: var(--font-display); font-size: 1.8rem;">УПАКОВКА</h3>
            
            <div id="atlasDropzone" class="dropzone" style="min-height: 120px; padding: 1rem; border-width: 1px;">
              <p style="font-size: 1rem;">Перетащите PNG/JPG картинки сюда</p>
              <input type="file" id="imageInput" accept="image/png, image/jpeg" multiple style="display:none;">
            </div>
            
            <div class="form-group" style="margin-top: 1.5rem;">
              <label class="form-label" for="paddingInput">Отступ (Padding, px)</label>
              <input type="number" id="paddingInput" class="form-input" value="2" min="0" max="10">
            </div>

            <div class="form-group">
              <label class="form-label" for="maxSizeInput">Макс. размер (px)</label>
              <select id="maxSizeInput" class="form-select">
                <option value="512">512 x 512</option>
                <option value="1024" selected>1024 x 1024</option>
                <option value="2048">2048 x 2048</option>
                <option value="4096">4096 x 4096</option>
              </select>
            </div>

            <div class="form-check">
              <input type="checkbox" id="trimInput" checked>
              <label for="trimInput">Trim Transparent Pixels</label>
            </div>
            
            <button id="btnPack" class="btn-cyber btn-cyber-primary" style="width: 100%; margin-top: 1rem; font-size: 1.2rem; padding: 0.5rem;">
              Собрать Атлас
            </button>

            <div id="exportGroup" style="display:none; margin-top: 1.5rem; gap: 0.5rem; flex-direction: column;">
              <button id="btnExportImage" class="btn-cyber btn-cyber-outline" style="width: 100%; font-size: 1rem; padding: 0.5rem;">Скачать .PNG</button>
              <button id="btnExportJson" class="btn-cyber btn-cyber-outline" style="width: 100%; font-size: 1rem; padding: 0.5rem;">Скачать .JSON</button>
            </div>
            
            <div id="fileList" style="margin-top: 1.5rem; max-height: 150px; overflow-y: auto; font-size: 0.85rem; color: #aaa;"></div>
          </aside>

          <!-- Main Workspace -->
          <div class="tool-main" style="display: flex; flex-direction: column; gap: 1.5rem;">
            <!-- Atlas Canvas View -->
            <div style="width: 100%; min-height: 380px; display: flex; align-items: center; justify-content: center; background: #111; background-image: linear-gradient(45deg, #181a1f 25%, transparent 25%), linear-gradient(-45deg, #181a1f 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #181a1f 75%), linear-gradient(-45deg, transparent 75%, #181a1f 75%); background-size: 20px 20px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); padding: 1rem; overflow: auto;">
              <canvas id="atlasCanvas" style="box-shadow: 0 0 20px rgba(0,0,0,0.8); max-width: 100%; max-height: 480px;"></canvas>
            </div>

            <!-- Sprite Animation Previewer -->
            <div id="animPreviewCard" style="display: none; background: rgba(0,0,0,0.5); border: 1px solid rgba(30, 214, 91, 0.3); border-radius: 12px; padding: 1.2rem;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h4 style="color: var(--color-primary); margin: 0; font-family: var(--font-display); letter-spacing: 1px;">ANIMATION PREVIEW</h4>
                <div id="animFrameIndicator" style="font-size: 0.85rem; color: var(--color-text-muted); font-family: monospace;">Frame: 1 / 1</div>
              </div>

              <div style="display: grid; grid-template-columns: 200px 1fr; gap: 1.5rem; align-items: center;">
                <!-- Anim Canvas -->
                <div style="width: 200px; height: 180px; background: #05070a; background-image: linear-gradient(45deg, #141820 25%, transparent 25%), linear-gradient(-45deg, #141820 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #141820 75%), linear-gradient(-45deg, transparent 75%, #141820 75%); background-size: 16px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; overflow: hidden;">
                  <canvas id="animCanvas" width="180" height="160" style="max-width: 100%; max-height: 100%; image-rendering: pixelated;"></canvas>
                </div>

                <!-- Controls -->
                <div style="display: flex; flex-direction: column; gap: 0.8rem;">
                  <div style="display: flex; gap: 0.8rem; align-items: center;">
                    <button id="btnPlayPause" class="btn-cyber btn-cyber-primary" style="padding: 6px 16px; font-size: 0.9rem;">Pause</button>
                    <button id="btnStepPrev" class="btn-cyber" style="padding: 6px 12px; background: rgba(255,255,255,0.05); color:#fff; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; cursor: pointer;">&larr;</button>
                    <button id="btnStepNext" class="btn-cyber" style="padding: 6px 12px; background: rgba(255,255,255,0.05); color:#fff; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; cursor: pointer;">&rarr;</button>
                  </div>

                  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div>
                      <label class="form-label" style="font-size: 0.8rem;">Speed (FPS): <span id="fpsVal">12</span></label>
                      <input type="range" id="animFps" min="1" max="60" value="12" style="width: 100%;">
                    </div>
                    <div>
                      <label class="form-label" style="font-size: 0.8rem;">Playback Mode</label>
                      <select id="animMode" class="form-select" style="padding: 4px 8px; font-size: 0.85rem;">
                        <option value="loop" selected>Loop</option>
                        <option value="pingpong">Ping-Pong</option>
                        <option value="once">Play Once</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>

      </div>
    </section>
  </main>

  <script>
    const atlasDropzone = document.getElementById('atlasDropzone');
    const imageInput = document.getElementById('imageInput');
    const fileList = document.getElementById('fileList');
    const btnPack = document.getElementById('btnPack');
    const paddingInput = document.getElementById('paddingInput');
    const maxSizeInput = document.getElementById('maxSizeInput');
    const atlasCanvas = document.getElementById('atlasCanvas');
    const ctx = atlasCanvas.getContext('2d');
    const btnExportImage = document.getElementById('btnExportImage');
    const btnExportJson = document.getElementById('btnExportJson');
    const exportGroup = document.getElementById('exportGroup');

    let loadedImages = [];
    let packedData = null;

    atlasDropzone.addEventListener('click', () => imageInput.click());
    atlasDropzone.addEventListener('dragover', (e) => { e.preventDefault(); atlasDropzone.classList.add('dragover'); });
    atlasDropzone.addEventListener('dragleave', () => atlasDropzone.classList.remove('dragover'));
    atlasDropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      atlasDropzone.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
    });
    imageInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFiles(e.target.files);
    });

    function handleFiles(files) {
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        if (!file.type.startsWith('image/')) continue;
        
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            loadedImages.push({ name: file.name, img: img, w: img.width, h: img.height });
            updateFileList();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function updateFileList() {
      fileList.innerHTML = `Загружено картинок: ${loadedImages.length}<br>` + loadedImages.map(f => f.name).join('<br>');
    }

    const trimInput = document.getElementById('trimInput');
    const animPreviewCard = document.getElementById('animPreviewCard');
    const animCanvas = document.getElementById('animCanvas');
    const animCtx = animCanvas.getContext('2d');
    const animFrameIndicator = document.getElementById('animFrameIndicator');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const btnStepPrev = document.getElementById('btnStepPrev');
    const btnStepNext = document.getElementById('btnStepNext');
    const animFps = document.getElementById('animFps');
    const fpsVal = document.getElementById('fpsVal');
    const animMode = document.getElementById('animMode');

    let isPlayingAnim = true;
    let animFramesList = [];
    let currentFrameIndex = 0;
    let animDirection = 1;
    let animTimer = null;

    animFps.addEventListener('input', (e) => {
      fpsVal.textContent = e.target.value;
      if (isPlayingAnim) restartAnimLoop();
    });

    btnPlayPause.addEventListener('click', () => {
      isPlayingAnim = !isPlayingAnim;
      btnPlayPause.textContent = isPlayingAnim ? 'Pause' : 'Play';
      if (isPlayingAnim) restartAnimLoop();
      else clearTimeout(animTimer);
    });

    btnStepPrev.addEventListener('click', () => {
      if (animFramesList.length === 0) return;
      currentFrameIndex = (currentFrameIndex - 1 + animFramesList.length) % animFramesList.length;
      drawAnimFrame();
    });

    btnStepNext.addEventListener('click', () => {
      if (animFramesList.length === 0) return;
      currentFrameIndex = (currentFrameIndex + 1) % animFramesList.length;
      drawAnimFrame();
    });

    function restartAnimLoop() {
      clearTimeout(animTimer);
      if (!isPlayingAnim || animFramesList.length === 0) return;
      
      const interval = 1000 / parseInt(animFps.value);
      animTimer = setTimeout(() => {
        advanceAnimFrame();
        restartAnimLoop();
      }, interval);
    }

    function advanceAnimFrame() {
      if (animFramesList.length === 0) return;
      const mode = animMode.value;

      if (mode === 'loop') {
        currentFrameIndex = (currentFrameIndex + 1) % animFramesList.length;
      } else if (mode === 'pingpong') {
        currentFrameIndex += animDirection;
        if (currentFrameIndex >= animFramesList.length) {
          currentFrameIndex = Math.max(0, animFramesList.length - 2);
          animDirection = -1;
        } else if (currentFrameIndex < 0) {
          currentFrameIndex = Math.min(1, animFramesList.length - 1);
          animDirection = 1;
        }
      } else if (mode === 'once') {
        if (currentFrameIndex < animFramesList.length - 1) {
          currentFrameIndex++;
        } else {
          isPlayingAnim = false;
          btnPlayPause.textContent = 'Play';
        }
      }

      drawAnimFrame();
    }

    function drawAnimFrame() {
      if (animFramesList.length === 0) return;
      const frameData = animFramesList[currentFrameIndex];
      animFrameIndicator.textContent = `Frame: ${currentFrameIndex + 1} / ${animFramesList.length} (${frameData.name})`;

      animCtx.clearRect(0, 0, animCanvas.width, animCanvas.height);

      // Draw centered inside animCanvas
      const scale = Math.min(
        (animCanvas.width - 20) / frameData.sourceW,
        (animCanvas.height - 20) / frameData.sourceH,
        2 // Max 2x zoom
      );
      
      const drawW = frameData.cropW * scale;
      const drawH = frameData.cropH * scale;
      const originX = (animCanvas.width - frameData.sourceW * scale) / 2 + frameData.trimX * scale;
      const originY = (animCanvas.height - frameData.sourceH * scale) / 2 + frameData.trimY * scale;

      animCtx.drawImage(
        frameData.drawable,
        0, 0, frameData.cropW, frameData.cropH,
        originX, originY, drawW, drawH
      );
    }

    // Alpha Trimmer function
    function getTrimmedData(img) {
      const c = document.createElement('canvas');
      c.width = img.width;
      c.height = img.height;
      const cx = c.getContext('2d');
      cx.drawImage(img, 0, 0);

      const imgData = cx.getImageData(0, 0, c.width, c.height);
      const data = imgData.data;
      let minX = c.width, minY = c.height, maxX = 0, maxY = 0;
      let hasPixels = false;

      for (let y = 0; y < c.height; y++) {
        for (let x = 0; x < c.width; x++) {
          const alpha = data[(y * c.width + x) * 4 + 3];
          if (alpha > 5) { // Visible threshold
            hasPixels = true;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      if (!hasPixels) {
        return {
          trimmed: false,
          drawable: img,
          cropX: 0, cropY: 0,
          cropW: img.width, cropH: img.height,
          trimX: 0, trimY: 0,
          sourceW: img.width, sourceH: img.height
        };
      }

      const cropW = (maxX - minX) + 1;
      const cropH = (maxY - minY) + 1;

      const trimmedCanvas = document.createElement('canvas');
      trimmedCanvas.width = cropW;
      trimmedCanvas.height = cropH;
      const trimCtx = trimmedCanvas.getContext('2d');
      trimCtx.drawImage(img, minX, minY, cropW, cropH, 0, 0, cropW, cropH);

      return {
        trimmed: true,
        drawable: trimmedCanvas,
        cropX: minX, cropY: minY,
        cropW: cropW, cropH: cropH,
        trimX: minX, trimY: minY,
        sourceW: img.width, sourceH: img.height
      };
    }

    // Bin Packing Algorithm
    function packImages() {
      if (loadedImages.length === 0) return alert('Загрузите картинки!');
      
      const padding = parseInt(paddingInput.value);
      const maxSize = parseInt(maxSizeInput.value);
      const doTrim = trimInput.checked;
      
      // Prepare processed items
      const processedItems = loadedImages.map(item => {
        if (doTrim) {
          const trimInfo = getTrimmedData(item.img);
          return {
            name: item.name,
            drawable: trimInfo.drawable,
            w: trimInfo.cropW,
            h: trimInfo.cropH,
            trimmed: trimInfo.trimmed,
            trimX: trimInfo.trimX,
            trimY: trimInfo.trimY,
            cropW: trimInfo.cropW,
            cropH: trimInfo.cropH,
            sourceW: trimInfo.sourceW,
            sourceH: trimInfo.sourceH
          };
        } else {
          return {
            name: item.name,
            drawable: item.img,
            w: item.w,
            h: item.h,
            trimmed: false,
            trimX: 0,
            trimY: 0,
            cropW: item.w,
            cropH: item.h,
            sourceW: item.w,
            sourceH: item.h
          };
        }
      });

      // Sort by height descending
      const rects = [...processedItems].sort((a, b) => b.h - a.h);
      
      let currentX = 0;
      let currentY = 0;
      let maxRowHeight = 0;
      let canvasW = 0;
      let canvasH = 0;
      
      const packed = [];

      for (const rect of rects) {
        if (currentX + rect.w + padding > maxSize) {
          currentY += maxRowHeight + padding;
          currentX = 0;
          maxRowHeight = 0;
        }
        
        if (currentY + rect.h + padding > maxSize) {
          alert('Некоторые картинки не влезли в атлас! Увеличьте макс. размер.');
          break;
        }

        packed.push({
          ...rect,
          x: currentX,
          y: currentY
        });

        currentX += rect.w + padding;
        maxRowHeight = Math.max(maxRowHeight, rect.h);
        
        canvasW = Math.max(canvasW, currentX);
        canvasH = Math.max(canvasH, currentY + maxRowHeight);
      }
      
      // Power of Two rounding
      const potW = Math.pow(2, Math.ceil(Math.log2(canvasW || 64)));
      const potH = Math.pow(2, Math.ceil(Math.log2(canvasH || 64)));
      
      atlasCanvas.width = potW;
      atlasCanvas.height = potH;
      
      ctx.clearRect(0, 0, potW, potH);
      
      const jsonFrames = {};

      for (const item of packed) {
        ctx.drawImage(item.drawable, item.x, item.y, item.w, item.h);
        
        jsonFrames[item.name] = {
          frame: { x: item.x, y: item.y, w: item.w, h: item.h },
          rotated: false,
          trimmed: item.trimmed,
          spriteSourceSize: { x: item.trimX, y: item.trimY, w: item.cropW, h: item.cropH },
          sourceSize: { w: item.sourceW, h: item.sourceH }
        };
      }
      
      packedData = {
        frames: jsonFrames,
        meta: {
          app: "xGR3ENx Texture Packer",
          image: "atlas.png",
          format: "RGBA8888",
          size: { w: potW, h: potH },
          scale: "1"
        }
      };

      exportGroup.style.display = 'flex';

      // Setup Animation Preview
      animFramesList = [...processedItems];
      if (animFramesList.length > 0) {
        animPreviewCard.style.display = 'block';
        currentFrameIndex = 0;
        isPlayingAnim = true;
        btnPlayPause.textContent = 'Pause';
        drawAnimFrame();
        restartAnimLoop();
      }
    }

    btnPack.addEventListener('click', packImages);

    function download(dataUrl, filename) {
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    btnExportImage.addEventListener('click', () => {
      if (!packedData) return;
      download(atlasCanvas.toDataURL('image/png'), 'atlas.png');
    });

    btnExportJson.addEventListener('click', () => {
      if (!packedData) return;
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(packedData, null, 2));
      download(dataStr, 'atlas.json');
    });
  </script>

</body>
</html>
