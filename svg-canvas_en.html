<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>SVG to Canvas Converter | xGR3ENx Tools</title>
  
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="font/stylesheet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/modern.css">
  <link rel="stylesheet" href="css/tools.css">
</head>

<body>
  <!-- Header -->
  <header class="site-header scrolled">
    <div class="site-container">
      <div class="nav-wrapper">
        <a href="index.html" class="brand-logo-link" title="xGR3ENx Tools">
          <img class="brand-logo-img" src="img/logo.svg" alt="xGR3ENx Logo" width="44" height="44">
          <div class="brand-logo-text">
            xGR3ENx
            <span>TOOLS</span>
          </div>
        </a>
        <ul class="nav-menu">
          <li>
            <div class="lang-switcher">
              <button class="lang-btn" data-lang="ru" onclick="window.location.href='svg-canvas.html'">RU</button>
              <button class="lang-btn active" data-lang="en" onclick="window.location.href='svg-canvas_en.html'">EN</button>
            </div>
          </li>
          <li><a href="index.html" class="nav-item-link">HOME</a></li>
        </ul>
      </div>
    </div>
  </header>

  <main style="padding-top: 100px;">
    <section class="section-wrapper" style="padding-top: 2rem;">
      <div class="site-container">
        
        <div class="tool-header">
          <h1>SVG TO CANVAS CONVERTER</h1>
          <p>Convert vector SVG icons into native JS Canvas 2D code (Path2D). Perfect for lightweight UI elements.</p>
        </div>

        <div class="tool-layout">
          <!-- Settings Sidebar -->
          <aside class="tool-sidebar">
            <h3 style="margin-bottom: 1.5rem; color: var(--color-primary); font-family: var(--font-display); font-size: 1.8rem;">INPUT SVG</h3>
            
            <div id="svgDropzone" class="dropzone" style="min-height: 100px; padding: 1rem; border-width: 1px;">
              <p style="font-size: 0.9rem;">Drop .SVG file here</p>
              <input type="file" id="svgFileInput" accept=".svg" style="display:none;">
            </div>

            <div class="form-group" style="margin-top: 1.2rem;">
              <label class="form-label">Icon Presets</label>
              <select id="svgPresetSelect" class="form-select">
                <option value="trophy" selected>Trophy</option>
                <option value="gamepad">Gamepad</option>
                <option value="star">Star</option>
                <option value="heart">Heart</option>
                <option value="coin">Coin</option>
                <option value="shield">Shield</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Or paste SVG code:</label>
              <textarea id="svgCodeInput" class="form-select notranslate" translate="no" style="height: 120px; font-family: monospace; font-size: 0.75rem; resize: vertical;"></textarea>
            </div>

            <div class="form-group">
              <label class="form-label">Fill Color Override</label>
              <div style="display: flex; gap: 0.5rem; align-items: center;">
                <input type="color" id="overrideColor" value="#1ed65f" style="width: 44px; height: 38px; border: none; background: transparent; cursor: pointer;">
                <label style="font-size: 0.85rem; color: #fff; cursor: pointer; display: flex; align-items: center; gap: 6px;">
                  <input type="checkbox" id="chkOverrideColor" style="accent-color: var(--color-primary);" checked>
                  Apply Color
                </label>
              </div>
            </div>

            <button id="btnConvert" class="btn-cyber btn-cyber-primary" style="width: 100%; margin-top: 1rem; font-size: 1.1rem; padding: 0.6rem;">
              Convert to JS
            </button>
          </aside>

          <!-- Main Workspace -->
          <div class="tool-main" style="display: flex; flex-direction: column; gap: 1.5rem;">
            
            <!-- Live Canvas Vector Preview -->
            <div style="background: rgba(0,0,0,0.5); border: 1px solid var(--color-primary); border-radius: 12px; padding: 1.2rem;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem;">
                <h4 style="color: var(--color-primary); margin: 0; font-family: var(--font-display);">CANVAS RENDER PREVIEW</h4>
                <div style="display: flex; gap: 0.8rem; align-items: center;">
                  <span style="font-size: 0.8rem; color: var(--color-text-muted);">Size:</span>
                  <input type="range" id="previewSize" min="32" max="256" value="128" style="width: 100px;">
                  <span id="previewSizeVal" style="font-family: monospace; font-size: 0.8rem; color: #fff;">128px</span>
                </div>
              </div>

              <div style="width: 100%; height: 260px; background: #05070a; background-image: linear-gradient(45deg, #12161f 25%, transparent 25%), linear-gradient(-45deg, #12161f 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #12161f 75%), linear-gradient(-45deg, transparent 75%, #12161f 75%); background-size: 16px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; overflow: hidden;">
                <canvas id="vectorCanvas" width="300" height="240"></canvas>
              </div>
            </div>

            <!-- Output JS Code -->
            <div style="background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1.2rem;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem;">
                <h4 style="color: var(--color-primary); margin: 0; font-family: var(--font-display);">JS CANVAS FUNCTION:</h4>
                <button id="btnCopyJs" class="btn-cyber" style="padding: 4px 12px; font-size: 0.8rem;">Copy Code</button>
              </div>
              <textarea id="jsCodeOutput" class="notranslate" translate="no" style="width: 100%; height: 220px; background: #080a0f; color: #a6e22e; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; font-family: monospace; font-size: 0.8rem; padding: 0.8rem; resize: vertical;" readonly></textarea>
            </div>

          </div>
        </div>

      </div>
    </section>
  </main>

  <script>
    const svgDropzone = document.getElementById('svgDropzone');
    const svgFileInput = document.getElementById('svgFileInput');
    const svgPresetSelect = document.getElementById('svgPresetSelect');
    const svgCodeInput = document.getElementById('svgCodeInput');
    const overrideColor = document.getElementById('overrideColor');
    const chkOverrideColor = document.getElementById('chkOverrideColor');
    const btnConvert = document.getElementById('btnConvert');
    
    const previewSize = document.getElementById('previewSize');
    const previewSizeVal = document.getElementById('previewSizeVal');
    const vectorCanvas = document.getElementById('vectorCanvas');
    const vectorCtx = vectorCanvas.getContext('2d');
    const jsCodeOutput = document.getElementById('jsCodeOutput');
    const btnCopyJs = document.getElementById('btnCopyJs');

    const svgPresets = {
      trophy: `<svg viewBox="0 0 24 24" width="24" height="24"><path d="M6 2h12v6a6 6 0 0 1-12 0V2zM4 5H2a3 3 0 0 0 3 3h1V5zm14 0h2a3 3 0 0 1-3 3h-1V5zM10 16h4v4h3v2H7v-2h3v-4z" fill="#1ed65f"/></svg>`,
      gamepad: `<svg viewBox="0 0 24 24" width="24" height="24"><path d="M7 6h10a6 6 0 0 1 6 6v3a4 4 0 0 1-6.5 3.1L13.8 16H10.2l-2.7 2.1A4 4 0 0 1 1 15v-3a6 6 0 0 1 6-6zm-1 5v2h2v-2H6zm-2 0v2h2v-2H4zm4 0v2h2v-2H8zm-2-2v2h2V9H6zm10 2a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm2 2a1 1 0 1 0 0 2 1 1 0 0 0 0-2z" fill="#1ed65f"/></svg>`,
      star: `<svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="#1ed65f"/></svg>`,
      heart: `<svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#1ed65f"/></svg>`,
      coin: `<svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm1-13h-2v1H9v2h4v2H9v2h2v1h2v-1h2v-2h-4v-2h4V9h-2V7z" fill="#1ed65f"/></svg>`,
      shield: `<svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" fill="#1ed65f"/></svg>`
    };

    svgPresetSelect.addEventListener('change', () => {
      svgCodeInput.value = svgPresets[svgPresetSelect.value] || '';
      convertSvg();
    });

    svgDropzone.addEventListener('click', () => svgFileInput.click());
    svgDropzone.addEventListener('dragover', (e) => { e.preventDefault(); svgDropzone.classList.add('dragover'); });
    svgDropzone.addEventListener('dragleave', () => svgDropzone.classList.remove('dragover'));
    svgDropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      svgDropzone.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleSvgFile(e.dataTransfer.files[0]);
    });
    svgFileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleSvgFile(e.target.files[0]);
    });

    function handleSvgFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        svgCodeInput.value = e.target.result;
        convertSvg();
      };
      reader.readAsText(file);
    }

    let parsedPaths = [];
    let svgViewBox = { w: 24, h: 24 };

    function convertSvg() {
      const xmlStr = svgCodeInput.value.trim();
      if (!xmlStr) return;

      const parser = new DOMParser();
      const doc = parser.parseFromString(xmlStr, 'image/svg+xml');
      const svgEl = doc.querySelector('svg');
      if (!svgEl) return;

      // Extract ViewBox
      let vb = svgEl.getAttribute('viewBox');
      if (vb) {
        const parts = vb.split(/[\s,]+/).map(Number);
        if (parts.length === 4) {
          svgViewBox = { w: parts[2], h: parts[3] };
        }
      } else {
        svgViewBox = {
          w: parseFloat(svgEl.getAttribute('width')) || 24,
          h: parseFloat(svgEl.getAttribute('height')) || 24
        };
      }

      parsedPaths = [];
      const paths = svgEl.querySelectorAll('path');
      paths.forEach(p => {
        const d = p.getAttribute('d');
        const fill = p.getAttribute('fill') || '#1ed65f';
        if (d) parsedPaths.push({ d: d, fill: fill });
      });

      renderVectorPreview();
      generateJsCode();
    }

    function renderVectorPreview() {
      const size = parseInt(previewSize.value) || 128;
      previewSizeVal.textContent = size + 'px';

      vectorCtx.clearRect(0, 0, vectorCanvas.width, vectorCanvas.height);

      const scale = size / Math.max(svgViewBox.w, svgViewBox.h);
      const drawX = (vectorCanvas.width - svgViewBox.w * scale) / 2;
      const drawY = (vectorCanvas.height - svgViewBox.h * scale) / 2;

      vectorCtx.save();
      vectorCtx.translate(drawX, drawY);
      vectorCtx.scale(scale, scale);

      parsedPaths.forEach(item => {
        const path2d = new Path2D(item.d);
        vectorCtx.fillStyle = chkOverrideColor.checked ? overrideColor.value : item.fill;
        vectorCtx.fill(path2d);
      });

      vectorCtx.restore();
    }

    function generateJsCode() {
      const pathsCode = parsedPaths.map(p => {
        const fill = chkOverrideColor.checked ? overrideColor.value : p.fill;
        return `  // Path\n  const p = new Path2D("${p.d}");\n  ctx.fillStyle = fill || "${fill}";\n  ctx.fill(p);`;
      }).join('\n\n');

      const code = `// Отрисовка векторной иконки на HTML5 Canvas (без загрузки внешних картинок)
function drawVectorIcon(ctx, x, y, size, fill) {
  ctx.save();
  ctx.translate(x, y);
  const scale = size / ${Math.max(svgViewBox.w, svgViewBox.h)};
  ctx.scale(scale, scale);

${pathsCode}

  ctx.restore();
}

// Пример использования:
// drawVectorIcon(ctx, 100, 100, 64, "#1ed65f");`;

      jsCodeOutput.value = code;
    }

    previewSize.addEventListener('input', renderVectorPreview);
    [overrideColor, chkOverrideColor].forEach(el => el.addEventListener('input', () => { renderVectorPreview(); generateJsCode(); }));
    btnConvert.addEventListener('click', convertSvg);

    btnCopyJs.addEventListener('click', () => {
      navigator.clipboard.writeText(jsCodeOutput.value).then(() => {
        btnCopyJs.textContent = '✓ Скопировано!';
        setTimeout(() => btnCopyJs.textContent = 'Copy Code', 2000);
      });
    });

    // Initialize with Trophy preset
    svgCodeInput.value = svgPresets.trophy;
    convertSvg();
  </script>

</body>
</html>
