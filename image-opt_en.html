<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Image Optimizer | xGR3ENx Tools</title>
  
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="font/stylesheet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/modern.css">
  <link rel="stylesheet" href="css/tools.css">
</head>

<body>
  <!-- Header -->
  <header class="site-header scrolled">
    <div class="site-container">
      <div class="nav-wrapper">
        <a href="index.html" class="brand-logo-link" title="xGR3ENx Tools">
          <img class="brand-logo-img" src="img/logo.svg" alt="xGR3ENx Logo" width="44" height="44">
          <div class="brand-logo-text">
            xGR3ENx
            <span>TOOLS</span>
          </div>
        </a>
        <ul class="nav-menu">
          <li>
            <div class="lang-switcher">
              <button class="lang-btn" data-lang="ru" onclick="window.location.href='image-opt.html'">RU</button>
              <button class="lang-btn active" data-lang="en" onclick="window.location.href='image-opt_en.html'">EN</button>
            </div>
          </li>
          <li><a href="index.html" class="nav-item-link">HOME</a></li>
        </ul>
      </div>
    </div>
  </header>

  <main style="padding-top: 100px;">
    <section class="section-wrapper" style="padding-top: 2rem;">
      <div class="site-container">
        
        <div class="tool-header">
          <h1>IMAGE OPTIMIZER</h1>
          <p>Сжатие PNG и JPG прямо в браузере для Playable Ads. Экономия веса без потери качества.</p>
        </div>

        <div class="tool-layout">
          <!-- Settings Sidebar -->
          <aside class="tool-sidebar">
            <h3 style="margin-bottom: 1.5rem; color: var(--color-primary); font-family: var(--font-display); font-size: 1.8rem;">НАСТРОЙКИ СЖАТИЯ</h3>
            
            <div class="form-group">
              <label class="form-label">Качество JPEG/WebP: <span id="qualityVal">80</span>%</label>
              <input type="range" id="qualitySlider" min="10" max="100" value="80">
            </div>
            
            <div class="form-group">
              <label class="form-label">Максимальная ширина (px)</label>
              <input type="number" id="maxWidthInput" class="form-input" placeholder="Не менять" min="10">
              <p style="font-size:0.8rem; color:var(--color-text-muted); margin-top:0.3rem;">Оставьте пустым для сохранения оригинала</p>
            </div>
            
            <div class="form-group">
              <label class="form-label">Формат вывода</label>
              <select id="formatSelect" class="form-select">
                <option value="image/webp" selected>WebP (Современно, есть прозрачность)</option>
                <option value="image/jpeg">JPEG (Лучшее сжатие, нет прозрачности)</option>
                <option value="image/png">PNG (Оригинал, с прозрачностью)</option>
              </select>
            </div>

            <button id="downloadBtn" class="btn-cyber btn-cyber-primary tool-btn" style="width: 100%; display: none;">Скачать</button>
          </aside>

          <!-- Main Workspace -->
          <div class="tool-main">
            
            <div id="dropzone" class="dropzone" style="min-height: 150px; padding: 1.5rem;">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline>
              </svg>
              <p style="margin-top: 0.5rem; font-size: 1rem;">Перетащите картинку сюда</p>
              <input type="file" id="fileInput" accept="image/*" style="display:none;">
            </div>

            <div style="margin-top: 2rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; align-items: start;">
              <!-- Original -->
              <div>
                <h4 style="color: #fff; margin-bottom: 0.5rem;">Оригинал <span id="origSize" style="color: #ff3333; float:right;"></span></h4>
                <div style="background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 0.5rem; text-align: center; min-height: 200px; display:flex; align-items:center; justify-content:center;">
                  <img id="origImg" style="max-width: 100%; max-height: 400px; object-fit: contain; display:none;">
                  <span id="origPlaceholder" style="color: var(--color-text-muted);">Нет изображения</span>
                </div>
              </div>
              
              <!-- Optimized -->
              <div>
                <h4 style="color: #fff; margin-bottom: 0.5rem;">Оптимизировано <span id="optSize" style="color: var(--color-primary); float:right;"></span></h4>
                <div style="background: rgba(0,0,0,0.5); border: 1px dashed var(--color-primary); border-radius: 4px; padding: 0.5rem; text-align: center; min-height: 200px; display:flex; align-items:center; justify-content:center; position: relative;">
                  <img id="optImg" style="max-width: 100%; max-height: 400px; object-fit: contain; display:none;">
                  <span id="optPlaceholder" style="color: var(--color-text-muted);">Нет изображения</span>
                  <div id="savingBadge" style="position:absolute; top: 10px; right: 10px; background: var(--color-primary); color: #000; padding: 2px 8px; border-radius: 12px; font-weight: bold; font-size: 0.8rem; display:none;"></div>
                </div>
              </div>
            </div>

          </div>
        </div>

      </div>
    </section>
  </main>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const qualitySlider = document.getElementById('qualitySlider');
    const qualityVal = document.getElementById('qualityVal');
    const maxWidthInput = document.getElementById('maxWidthInput');
    const formatSelect = document.getElementById('formatSelect');
    
    const origImg = document.getElementById('origImg');
    const optImg = document.getElementById('optImg');
    const origSize = document.getElementById('origSize');
    const optSize = document.getElementById('optSize');
    const savingBadge = document.getElementById('savingBadge');
    const downloadBtn = document.getElementById('downloadBtn');
    
    let currentFile = null;
    let currentImgObj = null;

    qualitySlider.addEventListener('input', (e) => {
      qualityVal.textContent = e.target.value;
      if (currentImgObj) processImage();
    });
    
    maxWidthInput.addEventListener('change', () => { if (currentImgObj) processImage(); });
    formatSelect.addEventListener('change', () => { if (currentImgObj) processImage(); });

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
      if (!file.type.startsWith('image/')) {
        alert('Пожалуйста, выберите изображение');
        return;
      }
      currentFile = file;
      origSize.textContent = (file.size / 1024).toFixed(1) + ' KB';
      
      document.getElementById('origPlaceholder').style.display = 'none';
      origImg.style.display = 'block';
      
      const reader = new FileReader();
      reader.onload = (e) => {
        origImg.src = e.target.result;
        
        currentImgObj = new Image();
        currentImgObj.onload = () => {
          processImage();
        };
        currentImgObj.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
    
    function processImage() {
      if (!currentImgObj) return;
      
      const canvas = document.createElement('canvas');
      let width = currentImgObj.width;
      let height = currentImgObj.height;
      
      const maxW = parseInt(maxWidthInput.value);
      if (maxW && width > maxW) {
        height = Math.round(height * (maxW / width));
        width = maxW;
      }
      
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      
      // If jpeg, fill white background to avoid transparent->black issue
      const format = formatSelect.value;
      if (format === 'image/jpeg') {
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, width, height);
      }
      
      ctx.drawImage(currentImgObj, 0, 0, width, height);
      
      const quality = parseInt(qualitySlider.value) / 100;
      const dataUrl = canvas.toDataURL(format, quality);
      
      document.getElementById('optPlaceholder').style.display = 'none';
      optImg.style.display = 'block';
      optImg.src = dataUrl;
      
      // Calc size roughly
      const base64str = dataUrl.split(',')[1];
      const sizeBytes = atob(base64str).length;
      optSize.textContent = (sizeBytes / 1024).toFixed(1) + ' KB';
      
      const diff = currentFile.size - sizeBytes;
      if (diff > 0) {
        const percent = ((diff / currentFile.size) * 100).toFixed(0);
        savingBadge.textContent = `-${percent}%`;
        savingBadge.style.display = 'block';
      } else {
        savingBadge.style.display = 'none';
      }
      
      downloadBtn.style.display = 'inline-flex';
      downloadBtn.onclick = () => {
        const a = document.createElement('a');
        a.href = dataUrl;
        const ext = format.split('/')[1];
        a.download = currentFile.name.replace(/\.[^/.]+$/, "") + "_opt." + (ext === 'jpeg' ? 'jpg' : ext);
        a.click();
      };
    }
  </script>

</body>
</html>
